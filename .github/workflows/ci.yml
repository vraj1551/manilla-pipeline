name: CI - Build & Push

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/manilla-api
  IMAGE_WEB: ghcr.io/${{ github.repository_owner }}/manilla-web
  IMAGE_ADMIN: ghcr.io/${{ github.repository_owner }}/manilla-admin

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # API
      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_API }}:latest
            ${{ env.IMAGE_API }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_API }}:latest
          cache-to: type=inline

      # Web (client)
      - name: Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:latest
            ${{ env.IMAGE_WEB }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_WEB }}:latest
          cache-to: type=inline
          build-args: |
            API_BASE_URL=${{ secrets.API_BASE_URL }}

      # Admin
      - name: Build & push Admin image
        uses: docker/build-push-action@v6
        with:
          context: ./admin-frontend
          push: true
          tags: |
            ${{ env.IMAGE_ADMIN }}:latest
            ${{ env.IMAGE_ADMIN }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_ADMIN }}:latest
          cache-to: type=inline
          build-args: |
            API_BASE_URL=${{ secrets.API_BASE_URL }}
